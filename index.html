<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Ops Zombies — map viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
  #ui { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,.65); padding: 10px 12px; border-radius: 6px; max-width: 320px; }
  #ui select, #ui button { font: inherit; margin: 2px 0; }
  #status { margin-top: 6px; white-space: pre-wrap; color: #9ad; }
  #help { color: #888; margin-top: 6px; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <div><b>Map</b> <select id="map"></select> <button id="load">Load</button></div>
  <div><label><input type="checkbox" id="smodels" checked> static models</label>
       <label><input type="checkbox" id="wire"> wireframe</label></div>
  <div id="status">pick a map</div>
  <div id="help">WASD/arrows move · drag to look · Q/E down/up · shift = fast</div>
  <div id="links"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';

const status = document.getElementById('status');
const sel = document.getElementById('map');
let manifest = { maps: [] };
try { manifest = await (await fetch('maps/manifest.json')).json(); } catch (e) { status.textContent = 'maps/manifest.json missing'; }
for (const m of manifest.maps) { const o = document.createElement('option'); o.value = m.name; o.textContent = `${m.name} (${m.stats?.surfaces ?? '?'} surfaces, ${m.stats?.smodels ?? '?'} models)`; sel.appendChild(o); }

document.getElementById('links').innerHTML = manifest.maps.map(m =>
  `<div><b>${m.name}</b>: <a href="data/${m.name}_world.json">lights/world</a> · <a href="data/${m.name}_mapents.txt">entities</a> · <a href="data/weapons_${m.name}.json">weapons</a> · <a href="data/${m.name}_textures.json">textures</a> · <a href="videos/${m.name}_load.mp4">load video</a></div>`).join('') +
  '<div><a href="videos/zombie_load.mp4">zombies intro</a> · <a href="videos/zombietron_outro.mp4">Dead Ops outro</a></div>' +
  '<div><b>models</b>: <a href="model.html?glb=models/t5_weapon_thundergun_world.glb">Thundergun</a> · <a href="model.html?glb=models/weapon_usa_ray_gun.glb">Ray Gun</a> · <a href="screenshots/">screenshots</a></div>';
document.getElementById('links').style.cssText = 'margin-top:8px;color:#888;font-size:12px';
document.querySelectorAll('#links a').forEach(a => a.style.color = '#9ad');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d22);
const hemi = new THREE.HemisphereLight(0xffffff, 0x444466, 1.2); scene.add(hemi);
const LM_INTENSITY = +(new URLSearchParams(location.search).get('lm') || 1.6);
const PROP_GAIN = +(new URLSearchParams(location.search).get('pg') || 1.0);
const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(50, 100, 30); scene.add(sun);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 2000);
camera.position.set(0, 2, 5);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// simple fly controls
const keys = {}; let yaw = 0, pitch = 0, dragging = false;
addEventListener('keydown', e => keys[e.code] = true); addEventListener('keyup', e => keys[e.code] = false);
renderer.domElement.addEventListener('mousedown', () => dragging = true);
addEventListener('mouseup', () => dragging = false);
addEventListener('mousemove', e => { if (!dragging) return; yaw -= e.movementX * 0.003; pitch = Math.max(-1.5, Math.min(1.5, pitch - e.movementY * 0.003)); });
const clock = new THREE.Clock();
function step() {
  const dt = clock.getDelta(); const speed = (keys.ShiftLeft || keys.ShiftRight ? 40 : 8) * dt;
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
  const f = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation), r = new THREE.Vector3(1, 0, 0).applyEuler(camera.rotation);
  if (keys.KeyW || keys.ArrowUp) camera.position.addScaledVector(f, speed);
  if (keys.KeyS || keys.ArrowDown) camera.position.addScaledVector(f, -speed);
  if (keys.KeyD || keys.ArrowRight) camera.position.addScaledVector(r, speed);
  if (keys.KeyA || keys.ArrowLeft) camera.position.addScaledVector(r, -speed);
  if (keys.KeyE) camera.position.y += speed; if (keys.KeyQ) camera.position.y -= speed;
  renderer.render(scene, camera); requestAnimationFrame(step);
}
step();

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
const ktx2 = new KTX2Loader().setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/basis/').detectSupport(renderer);
loader.setKTX2Loader(ktx2);
let current = null;
const qs = new URLSearchParams(location.search);
window.__setCam = (x, y, z, yawDeg, pitchDeg, fov) => { camera.position.set(x, y, z); yaw = yawDeg * Math.PI / 180; pitch = pitchDeg * Math.PI / 180; if (fov) { camera.fov = fov; camera.updateProjectionMatrix(); } };
window.__ready = false;
window.__pick = (px, py) => {   // debug: object under viewport pixel -> {node, material, distance}
  const rc = new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2(px / innerWidth * 2 - 1, -(py / innerHeight) * 2 + 1), camera);
  const hits = current ? rc.intersectObject(current, true) : [];
  return hits.slice(0, 3).map(h => ({ node: h.object.name, material: h.object.material?.name, hasMap: !!h.object.material?.map, distance: +h.distance.toFixed(2) }));
};
document.getElementById('load').onclick = async () => {
  if (current) { scene.remove(current); current = null; }
  const entry = manifest.maps.find(m => m.name === sel.value);
  const files = (entry.parts || [entry.glb]).map(f => 'maps/' + f); status.textContent = 'loading ' + entry.name + ' …';
  try {
    // fetch every part (large GLBs are split to stay under static-host file limits), join, parse
    const chunks = []; let got = 0;
    for (const url of files) {
      const res = await fetch(url); if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
      const total = +res.headers.get('Content-Length') || 0; const reader = res.body.getReader(); const buf = [];
      for (;;) { const { done, value } = await reader.read(); if (done) break; buf.push(value); got += value.length;
        status.textContent = `loading ${entry.name}: ${(got / 1048576).toFixed(1)} MB` + (total && files.length === 1 ? ` / ${(total / 1048576).toFixed(1)} MB` : ''); }
      chunks.push(...buf);
    }
    const joined = new Uint8Array(got); let off = 0; for (const c of chunks) { joined.set(c, off); off += c.length; }
    const gltf = await new Promise((ok, err) => loader.parse(joined.buffer, 'maps/', ok, err));
    current = gltf.scene; scene.add(current);
    let tris = 0, lit = 0;
    current.traverse(o => {
      if (!o.isMesh) return;
      tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
      const m = o.material; m.side = THREE.DoubleSide;
      if (m.aoMap && o.name.startsWith('world')) {           // baked lightmap carried in the occlusion slot (uv1)
        m.lightMap = m.aoMap; m.lightMap.colorSpace = THREE.SRGBColorSpace; m.lightMapIntensity = LM_INTENSITY; m.aoMap = null; lit++;
      }
      if (o.geometry.attributes.color && o.name.startsWith('world')) {   // baked per-vertex lighting: draw unlit
        const b = new THREE.MeshBasicMaterial({ map: m.map, color: m.color, vertexColors: true, side: THREE.DoubleSide, transparent: m.transparent, opacity: m.opacity, alphaTest: m.alphaTest, depthWrite: m.depthWrite, name: m.name });
        if (m.transparent) { b.polygonOffset = true; b.polygonOffsetFactor = -2; b.polygonOffsetUnits = -2; }
        o.material = b; lit++; return;
      }
      if (m.transparent) { m.polygonOffset = true; m.polygonOffsetFactor = -2; m.polygonOffsetUnits = -2; m.depthWrite = false; }
      if (/skybox|sky_/i.test(m.name) || /skybox/i.test(o.name)) { const b = new THREE.MeshBasicMaterial({ map: m.map, side: THREE.DoubleSide, fog: false }); o.material = b; return; }
      const light = (o.userData && o.userData.light) || (o.parent && o.parent.userData && o.parent.userData.light);
      if (light && o.name.startsWith('smodel')) {                   // baked ambient tint at the prop's position -> unlit
        const b = new THREE.MeshBasicMaterial({ map: m.map, side: THREE.DoubleSide, transparent: m.transparent, opacity: m.opacity, alphaTest: m.alphaTest, depthWrite: m.depthWrite, name: m.name });
        b.color.copy(m.color).multiply(new THREE.Color(light[0], light[1], light[2])).multiplyScalar(PROP_GAIN); o.material = b; return;
      }
      m.needsUpdate = true;
    });
    hemi.intensity = lit ? 0.7 : 1.2; sun.intensity = lit ? 0.5 : 1.0;   // props are still dynamically lit
    const box = new THREE.Box3().setFromObject(current); const c = box.getCenter(new THREE.Vector3());
    camera.position.copy(c).add(new THREE.Vector3(0, 3, 0)); yaw = 0; pitch = 0;
    if (qs.get('pos')) { const [x, y, z] = qs.get('pos').split(',').map(Number); window.__setCam(x, y, z, +(qs.get('yaw') || 0), +(qs.get('pitch') || 0), +(qs.get('fov') || 0)); }
    window.__ready = true;
    status.textContent = `loaded: ${Math.round(tris).toLocaleString()} triangles, ${lit} lightmapped meshes\nbounds ${box.min.toArray().map(v => v.toFixed(0))} … ${box.max.toArray().map(v => v.toFixed(0))} m`;
    applyToggles();
  } catch (e) { status.textContent = 'failed: ' + e.message; console.error(e); }
};
function applyToggles() {
  if (!current) return;
  const showS = document.getElementById('smodels').checked, wire = document.getElementById('wire').checked;
  current.traverse(o => { if (o.name.startsWith('smodel:')) o.visible = showS; if (o.isMesh) o.material.wireframe = wire; });
}
document.getElementById('smodels').onchange = applyToggles; document.getElementById('wire').onchange = applyToggles;
if (qs.get('ui') === '0') document.getElementById('ui').style.display = 'none';
if (qs.get('map')) { sel.value = qs.get('map'); document.getElementById('load').onclick(); }
</script>
</body>
</html>
