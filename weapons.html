<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Ops Zombies — weapon models</title>
<style>
  body { margin: 0; background: #1a1d22; color: #ddd; font: 14px/1.5 system-ui, sans-serif; }
  header { padding: 14px 18px; background: #111; } header a { color: #9ad; }
  main { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 52px); }
  nav { overflow: auto; border-right: 1px solid #333; padding: 8px 0; }
  nav h3 { margin: 10px 14px 4px; color: #888; font-size: 12px; text-transform: uppercase; }
  nav a { display: block; padding: 4px 14px; color: #cde; text-decoration: none; font-size: 13px; } nav a:hover, nav a.on { background: #26303a; }
  iframe { width: 100%; height: 100%; border: 0; background: #1a1d22; }
</style>
</head>
<body>
<header><b>Weapon models</b> extracted from the PS3 zombie zones · <a href="index.html">map viewer</a> · <span id="count"></span></header>
<main><nav id="nav"></nav><iframe id="view" src="model.html?glb=models/weapons/weapon_usa_ray_gun.glb"></iframe></main>
<script>
fetch('models/weapons/index.json').then(r => r.json()).then(d => {
  const nav = document.getElementById('nav'); let kind = '';
  document.getElementById('count').textContent = d.models.length + ' models';
  for (const m of d.models) {
    if (m.kind !== kind) { kind = m.kind; const h = document.createElement('h3'); h.textContent = kind; nav.appendChild(h); }
    const a = document.createElement('a'); a.href = '#' + m.name; a.textContent = m.name; a.title = `${m.zone} · ${m.bones} bones · ${m.surfaces} surfaces · textured ${m.textured}`;
    a.onclick = e => { e.preventDefault(); document.querySelectorAll('nav a').forEach(x => x.classList.remove('on')); a.classList.add('on'); document.getElementById('view').src = 'model.html?glb=models/weapons/' + m.name + '.glb'; location.hash = m.name; };
    nav.appendChild(a);
  }
  if (location.hash) { const a = [...nav.querySelectorAll('a')].find(x => x.hash === location.hash); if (a) a.click(); }
});
</script>
</body>
</html>
